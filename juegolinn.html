<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinnJuego - Torneo</title>
<style>
  :root {
    --panel-bg: rgba(30, 41, 59, 0.8);
    --hole-bg: #1e293b;
    --text-main: #f8fafc;
    --hit-color: #ef4444;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    color: var(--text-main);
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    /* Fondo animado simulando el mar */
    background: linear-gradient(180deg, #0284c7 0%, #1e3a8a 100%);
    position: relative;
  }

  /* Olas animadas en el fondo */
  .ocean {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 60%),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);
    background-size: 200% 200%;
    animation: waveMovement 15s ease-in-out infinite alternate;
    z-index: -1;
  }

  @keyframes waveMovement {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  h1 {
    margin-top: 0;
    font-size: 2.5rem;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    z-index: 1;
  }

  #scoreboard-container {
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 15px 30px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    min-width: 300px;
    z-index: 1;
  }

  #roundInfo {
    font-size: 1.2rem;
    color: #38bdf8;
    font-weight: bold;
    margin: 5px 0 15px 0;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 1.1rem;
    margin: 0;
  }

  /* Tablero del juego */
  #game {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    gap: 15px;
    justify-content: center;
    margin-bottom: 20px;
    z-index: 1;
  }

  .hole {
    width: 110px;
    height: 110px;
    background: var(--hole-bg);
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 10px 20px rgba(0,0,0,0.5), 0 2px 5px rgba(255,255,255,0.05);
    border-bottom: 4px solid #0f172a;
  }

  .key-hint {
    position: absolute;
    bottom: 5px;
    right: 8px;
    color: rgba(255, 255, 255, 0.4);
    font-weight: bold;
    font-size: 1.2rem;
    pointer-events: none;
    z-index: 5;
  }

  /* Diseño del pez */
  .fish {
    width: 70px;
    height: 55px;
    background: #f59e0b;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: absolute;
    bottom: -80px;
    left: 20px;
    transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.1s;
    cursor: pointer;
    z-index: 10;
  }

  .fish::after {
    content: '';
    position: absolute;
    right: -15px;
    top: 12px;
    border-left: 20px solid #d97706;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
  }

  .eye {
    width: 14px;
    height: 14px;
    background: white;
    border-radius: 50%;
    position: absolute;
    left: 15px;
    top: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease-out;
  }

  .eye::after {
    content: '';
    width: 6px;
    height: 6px;
    background: #000;
    border-radius: 50%;
  }

  .up { bottom: 15px; }

  .hit { background: var(--hit-color); }
  .hit .eye { transform: scale(2.2); }

  .floating-text {
    position: absolute;
    color: #4ade80;
    font-weight: bold;
    font-size: 1.5rem;
    animation: floatUp 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 20;
    left: 40px;
    bottom: 40px;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
  }

  button {
    padding: 12px 25px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    transition: transform 0.1s;
    z-index: 1;
  }

  button:active { transform: translateY(2px); }
  button:hover { background: linear-gradient(135deg, #60a5fa, #3b82f6); }

  /* Estilos de la Tabla de Liderazgo */
  #leaderboard {
    display: none; /* Oculto al inicio */
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(15px);
    border: 2px solid #38bdf8;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    z-index: 10;
    max-width: 500px;
    width: 90%;
  }

  #leaderboard h2 {
    color: #fbbf24;
    margin-top: 0;
  }

  .prize-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  .prize-table th, .prize-table td {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: left;
  }

  .prize-table th { color: #94a3b8; }
  .prize-table td { font-size: 1.1rem; font-weight: bold; }
  
  .total-score-highlight {
    font-size: 1.5rem;
    color: #4ade80;
    margin: 15px 0;
    border: 1px dashed #4ade80;
    padding: 10px;
    border-radius: 10px;
  }

  /* Ranking dinámico */
  .ranking-list {
    list-style: none;
    padding: 0;
    margin: 20px 0;
    text-align: left;
  }
  .ranking-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 15px;
    margin-bottom: 5px;
    background: rgba(255,255,255,0.05);
    border-radius: 5px;
  }
  .rank-1 { background: linear-gradient(90deg, #f59e0b, transparent); border-left: 5px solid #f59e0b; color: #fff; }
  .rank-2 { background: linear-gradient(90deg, #94a3b8, transparent); border-left: 5px solid #94a3b8; color: #fff; }
  .rank-3 { background: linear-gradient(90deg, #b45309, transparent); border-left: 5px solid #b45309; color: #fff; }

  #nameInputContainer {
    margin: 20px 0;
  }
  input[type="text"] {
    padding: 10px;
    border-radius: 5px;
    border: none;
    width: 200px;
    font-size: 1rem;
  }
</style>
</head>
<body>

<div class="ocean"></div>

<h1>🐟 Linn Game</h1>

<div id="scoreboard-container">
  <p id="roundInfo">Presiona "Iniciar" para comenzar</p>
  <div class="stats">
    <p>Puntos de ronda: <span id="score" style="color: #4ade80; font-weight: bold; font-size: 1.3rem;">0</span></p>
    <p>Ronda: <span id="roundDisplay">1/3</span></p>
  </div>
</div>

<div id="game"></div>

<button id="startBtn" onclick="startGame()">Iniciar Juego</button>

<div id="leaderboard">
  <h2>🏆 ¡Torneo Finalizado! 🏆</h2>
  <div class="total-score-highlight">
    Puntuación Total Lograda: <span id="finalScoreDisplay">0</span> pts
  </div>

  <div id="nameInputContainer">
    <input type="text" id="playerName" placeholder="Tu nombre o alias" maxlength="15">
    <button onclick="saveAndShowLeaderboard()">Guardar Puntaje</button>
  </div>

  <p>🏆 Cuadro de Honor y Premios:</p>
  <div id="leaderboardList" class="ranking-list"></div>

  <table class="prize-table">
    <tr>
      <th>1er Lugar</th>
      <td>🥇 Coca-Cola de 600ml</td>
    </tr>
    <tr>
      <th>2do Lugar</th>
      <td>🥈 Un Chocolate</td>
    </tr>
    <tr>
      <th>3er Lugar</th>
      <td>🥉 Una Paleta</td>
    </tr>
  </table>
  <br>
  <button onclick="location.reload()">Jugar Nueva Partida</button>
</div>

<script type="module">
/* --- Firebase Configuration --- */
// Reemplaza esto con tu propia configuración de Firebase
// Puedes obtenerla desde la consola de Firebase al crear una nueva app web
const firebaseConfig = {
  apiKey: "TU_API_KEY", // <-- Reemplaza con tu clave API
  authDomain: "TU_PROYECTO_ID.firebaseapp.com",
  databaseURL: "https://TU_PROYECTO_ID-default-rtdb.firebaseio.com",
  projectId: "TU_PROYECTO_ID",
  storageBucket: "TU_PROYECTO_ID.appspot.com",
  messagingSenderId: "TU_MESSAGING_SENDER_ID",
  appId: "TU_APP_ID"
};

// Import the functions you need from the SDKs you need
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
// Si deseas usar Analytics, descomenta la siguiente línea y la inicialización:
// import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";

// Tu configuración de Firebase proporcionada:
const firebaseConfig = {
  apiKey: "AIzaSyB8125Zh8lGGapYy2dYX60u3kvCvYrgAgI",
  authDomain: "real-time-database-8f390.firebaseapp.com",
  databaseURL: "https://real-time-database-8f390-default-rtdb.firebaseio.com", // Inferido de projectId
  projectId: "real-time-database-8f390",
  storageBucket: "real-time-database-8f390.firebasestorage.app",
  messagingSenderId: "439879258244",
  appId: "1:439879258244:web:2bbf4892a9579d9b7772d1",
  measurementId: "G-0QZSYKWF7J"
};

// Inicializa Firebase
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
// Si deseas usar Analytics, descomenta la siguiente línea:
// const analytics = getAnalytics(app);
/* --- Fin de la configuración de Firebase --- */

const game = document.getElementById("game");
const scoreEl = document.getElementById("score");
const roundInfo = document.getElementById("roundInfo");
const roundDisplay = document.getElementById("roundDisplay");
const startBtn = document.getElementById("startBtn");
const scoreboardContainer = document.getElementById("scoreboard-container");
const leaderboard = document.getElementById("leaderboard");
const finalScoreDisplay = document.getElementById("finalScoreDisplay");

let score = 0;
let totalScore = 0; // Sumatoria de todas las rondas
let round = 1;
let gameInterval;
let roundTimeout;
let speed = 1000;
let isPlaying = false;

// Exponer funciones al ámbito global para que puedan ser llamadas desde el HTML
window.startGame = startGame;
window.saveAndShowLeaderboard = saveAndShowLeaderboard;

// Orden del teclado numérico correcto (arriba hacia abajo, izquierda a derecha)
const numpadLayout = [7, 8, 9, 4, 5, 6, 1, 2, 3];
const fishDict = {}; // Para buscar rápido por número de tecla

// Audio Context para el sonido tipo peluche (sin archivos externos)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSqueakSound() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  
  osc.type = 'sine';
  osc.frequency.setValueAtTime(800, audioCtx.currentTime); // Tono agudo
  osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.1); // Sube más agudo rápido (squeak)
  
  gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

// Construir el tablero con el orden del numpad
numpadLayout.forEach(num => {
  const hole = document.createElement("div");
  hole.classList.add("hole");

  const keyHint = document.createElement("span");
  keyHint.classList.add("key-hint");
  keyHint.textContent = num;
  
  const fish = document.createElement("div");
  fish.classList.add("fish");
  
  const eye = document.createElement("div");
  eye.classList.add("eye");
  fish.appendChild(eye);

  // Clic con el mouse
  fish.addEventListener("mousedown", () => hitFish(fish, hole));

  hole.appendChild(fish);
  hole.appendChild(keyHint);
  game.appendChild(hole);
  
  fishDict[num] = { element: fish, hole: hole };
});

// Evento de teclado
document.addEventListener("keydown", (e) => {
  if (!isPlaying) return;
  const key = parseInt(e.key);
  if (fishDict[key]) {
    hitFish(fishDict[key].element, fishDict[key].hole);
  }
});

function hitFish(fish, hole) {
  if (fish.classList.contains("up") && !fish.classList.contains("hit")) {
    score++;
    totalScore++; // Sumamos al total
    scoreEl.textContent = score;
    
    playSqueakSound(); // Suena el peluche
    fish.classList.add("hit");
    showFloatingText(hole);

    setTimeout(() => {
      fish.classList.remove("up");
      fish.classList.remove("hit");
    }, 250);
  }
}

function showFloatingText(parentEl) {
  const floatText = document.createElement("div");
  floatText.textContent = "+1";
  floatText.classList.add("floating-text");
  parentEl.appendChild(floatText);
  setTimeout(() => floatText.remove(), 600);
}

function randomFish() {
  const allFish = Object.values(fishDict);
  allFish.forEach(f => {
    f.element.classList.remove("up");
    f.element.classList.remove("hit");
  });
  
  const randomKey = numpadLayout[Math.floor(Math.random() * numpadLayout.length)];
  const selectedFish = fishDict[randomKey].element;
  
  selectedFish.classList.add("up");

  setTimeout(() => {
    if(!selectedFish.classList.contains("hit")) {
      selectedFish.classList.remove("up");
    }
  }, speed * 0.7);
}

function startGame() {
  score = 0;
  scoreEl.textContent = score;
  isPlaying = true;
  startBtn.style.display = "none";
  roundInfo.textContent = "¡A golpear!";
  roundInfo.style.color = "#4ade80";
  roundDisplay.textContent = round + "/3";

  gameInterval = setInterval(randomFish, speed);
  roundTimeout = setTimeout(endRound, 10000); // 10 segundos por ronda
}

function endRound() {
  clearInterval(gameInterval);
  isPlaying = false;
  
  Object.values(fishDict).forEach(f => {
    f.element.classList.remove("up");
    f.element.classList.remove("hit");
  });

  round++;

  if (round <= 3) {
    speed *= 0.80; // Aumenta dificultad
    roundInfo.textContent = `¡Ronda ${round - 1} terminada! ¿Listos para la Ronda ${round}?`;
    roundInfo.style.color = "#fcd34d";
    startBtn.textContent = `Iniciar Ronda ${round}`;
    startBtn.style.display = "block";
  } else {
    // Terminan las 3 rondas, mostrar tabla de posiciones
    scoreboardContainer.style.display = "none";
    game.style.display = "none";
    startBtn.style.display = "none";
    
    finalScoreDisplay.textContent = totalScore;
    leaderboard.style.display = "block";
    renderLeaderboard();
  }
}

function saveAndShowLeaderboard() {
  const name = document.getElementById("playerName").value.trim() || "Anónimo";
  const newEntry = { name: name, score: totalScore, date: new Date().toLocaleDateString() };
  
  // Guardar el nuevo puntaje en Firebase
  push(ref(database, 'scores'), newEntry)
    .then(() => {
      console.log("Puntaje guardado en Firebase.");
    })
    .catch((error) => {
      console.error("Error al guardar el puntaje en Firebase:", error);
    });
  
  document.getElementById("nameInputContainer").style.display = "none";
  renderLeaderboard();
}

function renderLeaderboard() {
  const listContainer = document.getElementById("leaderboardList");
  listContainer.innerHTML = "";

  // Escuchar cambios en tiempo real en Firebase
  onValue(query(ref(database, 'scores'), orderByChild('score'), limitToLast(10)), (snapshot) => {
    let highScores = [];
    snapshot.forEach((childSnapshot) => {
      highScores.push(childSnapshot.val());
    });

    // Firebase's limitToLast ordena por clave, así que necesitamos ordenar por puntaje descendente
    highScores.sort((a, b) => b.score - a.score);

    listContainer.innerHTML = ""; // Limpiar la lista antes de renderizar para evitar duplicados

    highScores.forEach((entry, index) => {
      const item = document.createElement("div");
      item.classList.add("ranking-item");
      if (index === 0) item.classList.add("rank-1");
      if (index === 1) item.classList.add("rank-2");
      if (index === 2) item.classList.add("rank-3");

      item.innerHTML = `
        <span>${index + 1}. ${entry.name}</span>
        <span>${entry.score} pts</span>
      `;
      listContainer.appendChild(item);
    });
  });
}
</script>

</body>
</html>
